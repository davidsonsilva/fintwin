services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintwin}
      POSTGRES_DB: ${POSTGRES_DB:-fintwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fintwin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintwin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fintwin:fintwin@db:5432/fintwin}
      DEMO_DATA_DIR: /app/data/demo
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - ./data/demo:/app/data/demo:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  fintwin_db_data:
