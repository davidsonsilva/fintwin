<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Observer</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #020008;
    font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif;
    color: #fff;
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─── */
  #top-bar {
    height: 42px;
    background: rgba(10,5,30,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  #project-name {
    font-size: 12px;
    font-weight: 600;
    color: #00ffcc;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #top-divider { color: rgba(255,255,255,0.2); }
  #current-action {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #ws-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: all 0.3s;
  }
  #ws-badge.connected    { background: rgba(34,255,136,0.15); color: #22ff88; border: 1px solid rgba(34,255,136,0.3); }
  #ws-badge.disconnected { background: rgba(255,51,102,0.15); color: #ff3366; border: 1px solid rgba(255,51,102,0.3); }
  #ws-badge.connecting   { background: rgba(251,146,60,0.15); color: #fb923c; border: 1px solid rgba(251,146,60,0.3); }
  /* ─── DROPDOWN MENU ─── */
  #top-menu { position: relative; }
  #menu-toggle {
    font-size: 16px; cursor: pointer; line-height: 1;
    padding: 3px 8px; border-radius: 8px; color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    transition: all 0.2s;
  }
  #menu-toggle:hover { color: #fff; background: rgba(255,255,255,0.09); }
  #menu-items {
    position: absolute; right: 0; top: calc(100% + 6px);
    background: rgba(10,5,30,0.97); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 6px; min-width: 160px;
    backdrop-filter: blur(12px); z-index: 100;
    display: flex; flex-direction: column; gap: 4px;
  }
  #menu-items button {
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    padding: 7px 12px; border-radius: 7px; cursor: pointer;
    transition: all 0.2s; text-align: left; width: 100%;
  }
  #test-btn { border: 1px solid rgba(0,255,204,0.4); background: rgba(0,255,204,0.08); color: #00ffcc; }
  #test-btn:hover { background: rgba(0,255,204,0.18); }
  #tour-btn { border: 1px solid rgba(245,158,11,0.4); background: rgba(245,158,11,0.08); color: #f59e0b; }
  #tour-btn:hover { background: rgba(245,158,11,0.18); }
  #tour-btn.running { border-color: rgba(255,51,102,0.5); color: #ff3366; background: rgba(255,51,102,0.1); }
  #mute-btn { border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5); }
  #mute-btn:hover { background: rgba(255,255,255,0.09); color: #fff; }
  #restart-btn { border: 1px solid rgba(255,51,102,0.3); background: rgba(255,51,102,0.06); color: rgba(255,51,102,0.7); }
  #restart-btn:hover { background: rgba(255,51,102,0.15); color: #ff3366; }

  /* ─── MAIN AREA ─── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── GRAPH ─── */
  #graph-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #three-canvas { display: block; width: 100%; height: 100%; }
  .label-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #graph-hud {
    position: absolute;
    bottom: 16px; left: 16px;
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    line-height: 1.8;
    pointer-events: none;
  }
  #graph-err {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #ff4444;
    font-size: 13px;
    text-align: center;
    display: none;
    max-width: 400px;
    line-height: 1.6;
  }

  /* ─── LOG PANEL ─── */
  /* ─── CHAT PANEL ─── */
  #chat-panel {
    width: 360px; min-width: 280px;
    background: #0a0515;
    border-left: 1px solid rgba(255,255,255,0.07);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #chat-header {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  #chat-title {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; color: #00ffee;
  }
  #model-select {
    font-size: 10px; background: #0a0515;
    border: 1px solid rgba(255,255,255,0.12); color: #fff;
    border-radius: 6px; padding: 3px 8px; cursor: pointer; outline: none;
  }
  #model-select option { background: #0a0515; color: #fff; }
  #chat-messages {
    flex: 1; overflow-y: auto; padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }
  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  #chat-empty {
    text-align: center; color: rgba(255,255,255,0.15);
    font-size: 11px; padding: 40px 20px; line-height: 1.8;
  }
  .chat-msg { border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
  .chat-msg.user { background: rgba(0,255,238,0.08); border: 1px solid rgba(0,255,238,0.2); color: #00ffee; align-self: flex-end; max-width: 90%; }
  .chat-msg.claude { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  .chat-msg.tool-evt { padding: 2px 6px; font-size: 10px; color: rgba(255,255,255,0.3); background: transparent; border: none; animation: slideIn 0.15s ease; }
  .chat-msg.streaming::after { content: '▋'; animation: blink 0.8s step-end infinite; margin-left: 1px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes slideIn { from{opacity:0;transform:translateX(8px)} to{opacity:1;transform:none} }
  #chat-input-area {
    padding: 10px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
  }
  #chat-input {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1); color: #fff;
    border-radius: 8px; padding: 8px 10px; font-size: 12px;
    resize: none; font-family: inherit; line-height: 1.5;
    min-height: 56px; max-height: 120px; transition: border-color 0.2s;
  }
  #chat-input:focus { outline: none; border-color: rgba(0,255,238,0.4); }
  #chat-input::placeholder { color: rgba(255,255,255,0.2); }
  #chat-send-row { display: flex; justify-content: space-between; align-items: center; }
  #chat-status { font-size: 10px; color: rgba(255,255,255,0.3); }
  #chat-send {
    background: rgba(0,255,238,0.1); border: 1px solid rgba(0,255,238,0.3);
    color: #00ffee; border-radius: 8px; padding: 5px 14px; cursor: pointer;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; transition: all 0.2s;
  }
  #chat-send:hover { background: rgba(0,255,238,0.2); }
  #chat-send:disabled { opacity: 0.3; cursor: not-allowed; }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }              from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer }             from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }                 from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }            from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SPHERE_R = 14;
const COMMUNITY_COLORS = {
  0:'#00ffee', 1:'#cc00ff', 2:'#ffcc00', 3:'#00ff44',
  4:'#ff1155', 5:'#ff22cc', 6:'#ff6600', 7:'#00ccff',
  8:'#ff00ff', 9:'#aaff00', 10:'#ffd700', 11:'#ff88dd',
};
const TOOL_META = {
  Read:    { icon:'📖', color:'#00ffee', label:'Read' },
  Edit:    { icon:'✏️',  color:'#ffcc00', label:'Edit' },
  Write:   { icon:'📝', color:'#00ff44', label:'Write' },
  Grep:    { icon:'🔍', color:'#cc00ff', label:'Grep' },
  Glob:    { icon:'🔍', color:'#cc00ff', label:'Glob' },
  Bash:    { icon:'⚡', color:'#00ccff', label:'Bash' },
  WebFetch:  { icon:'🌐', color:'#ff00ff', label:'Fetch' },
  WebSearch: { icon:'🌐', color:'#ff00ff', label:'Search' },
  mcp__serena__find_symbol:      { icon:'🔎', color:'#ff22cc', label:'FindSymbol' },
  mcp__serena__find_declaration: { icon:'📍', color:'#ff22cc', label:'FindDecl' },
};
function toolMeta(name) {
  return TOOL_META[name] ?? { icon:'🔧', color:'#888', label: name?.split('__').pop() ?? name };
}

// ─── DOM REFS ─────────────────────────────────────────────────────────────────
const wrap        = document.getElementById('graph-wrap');
const canvas      = document.getElementById('three-canvas');
const hudEl       = document.getElementById('graph-hud');
const errEl       = document.getElementById('graph-err');
const wsBadge     = document.getElementById('ws-badge');
const actionEl    = document.getElementById('current-action');
const chatMessages = document.getElementById('chat-messages');
const chatEmpty   = document.getElementById('chat-empty');
const chatInput   = document.getElementById('chat-input');
const chatSend    = document.getElementById('chat-send');
const chatStatus  = document.getElementById('chat-status');
const modelSelect = document.getElementById('model-select');

let eventCount = 0;
function setWS(state) {
  wsBadge.className = state;
  wsBadge.textContent = { connected:'● LIVE', disconnected:'○ OFFLINE', connecting:'◌ CONECTANDO' }[state];
}

// ─── LOAD GRAPH ───────────────────────────────────────────────────────────────
let GRAPH;
try {
  const gp = new URLSearchParams(window.location.search).get('project');
  const res = await fetch(gp ? `/graph.json?project=${encodeURIComponent(gp)}` : '/graph.json');
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  GRAPH = await res.json();
} catch (e) {
  // Grafo ausente/inválido: mostra aviso mas NÃO impede o resto do dashboard.
  // O menu, o chat e o WebSocket vivem dentro de initScene — sempre inicializamos,
  // com grafo vazio se necessário, para que continuem funcionando sem graph.json.
  errEl.style.display = 'block';
  errEl.innerHTML = `Sem graph.json — 3D vazio. Rode <code>/graphify</code> neste projeto.<br><small>${e.message}</small>`;
}

initScene(GRAPH ?? { nodes: [], links: [] });

// ─── THREE.JS SCENE ───────────────────────────────────────────────────────────
function initScene(graph) {
  const W = () => wrap.clientWidth;
  const H = () => wrap.clientHeight;

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020008);

  // Camera
  const camera = new THREE.PerspectiveCamera(60, W()/H(), 0.1, 1000);
  // Distância que garante a esfera inteira visível (com margem), mesmo em telas estreitas
  // onde o aspect ratio encolhe o FOV horizontal e cortaria a esfera atrás do chat-panel.
  const FIT_MARGIN = 1.4;
  function fitDistance(w, h) {
    const vFov = camera.fov * Math.PI / 180;
    const aspect = w / h;
    return FIT_MARGIN * SPHERE_R / (Math.tan(vFov / 2) * Math.min(1, aspect));
  }
  camera.position.set(0, 0, fitDistance(W(), H()));

  // Renderer
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W(), H());
  renderer.toneMapping = THREE.ReinhardToneMapping;
  renderer.toneMappingExposure = 1.2;

  // CSS2DRenderer for labels
  const labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(W(), H());
  labelRenderer.domElement.className = 'label-layer';
  wrap.appendChild(labelRenderer.domElement);

  // Bloom
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(W(), H()), 1.3, 0.5, 0.1);
  composer.addPass(bloom);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(3, 4, 5);
  scene.add(key);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;
  let resumeTimer = null;
  controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
  controls.addEventListener('end',   () => { resumeTimer = setTimeout(() => { controls.autoRotate = true; }, 2500); });

  // ─── IDENTIFY GOD NODES ─────────────────────────────────────────────────────
  const degreeMap = new Map();
  graph.nodes.forEach(n => degreeMap.set(String(n.id), 0));
  (graph.links ?? []).forEach(e => {
    degreeMap.set(String(e.source), (degreeMap.get(String(e.source)) ?? 0) + 1);
    degreeMap.set(String(e.target), (degreeMap.get(String(e.target)) ?? 0) + 1);
  });
  const degrees = [...degreeMap.values()].sort((a,b) => b-a);
  const godThreshold = degrees[Math.floor(degrees.length * 0.1)] ?? 10;
  const godIds = new Set([...degreeMap.entries()].filter(([,d]) => d >= godThreshold).map(([id]) => id));

  // ─── FIBONACCI SPHERE LAYOUT ─────────────────────────────────────────────────
  const PHI = Math.PI * (3 - Math.sqrt(5));
  const N = graph.nodes.length;
  const sorted = [...graph.nodes].sort((a,b) => a.community - b.community);
  sorted.forEach((node, i) => {
    const y = 1 - (i / Math.max(N-1,1)) * 2;
    const r = Math.sqrt(Math.max(0, 1-y*y));
    node._x = Math.cos(PHI*i) * r * SPHERE_R;
    node._y = y * SPHERE_R;
    node._z = Math.sin(PHI*i) * r * SPHERE_R;
  });

  // ─── BUILD NODES ─────────────────────────────────────────────────────────────
  const nodeMap = new Map();   // id → mesh
  const nodeByFile = new Map(); // normalized source_file → node

  const geoIco = new THREE.IcosahedronGeometry(0.38, 1);
  const geoSph = new THREE.SphereGeometry(0.13, 10, 8);

  graph.nodes.forEach(node => {
    const id = String(node.id);
    const isGod = godIds.has(id);
    const hex = COMMUNITY_COLORS[node.community] ?? '#4a4a5a';
    const col = new THREE.Color(hex);
    const mat = new THREE.MeshStandardMaterial({
      color: col, emissive: col,
      emissiveIntensity: isGod ? 2.5 : 0.8,
      roughness: 0.3, metalness: 0.1,
    });
    const mesh = new THREE.Mesh(isGod ? geoIco : geoSph, mat);
    mesh.position.set(node._x ?? 0, node._y ?? 0, node._z ?? 0);
    mesh.userData = { id, isGod, baseIntensity: isGod ? 2.5 : 0.8, communityColor: hex };
    scene.add(mesh);
    nodeMap.set(id, mesh);

    // Index by source_file for event matching
    if (node.source_file) {
      const key = node.source_file.replace(/\\/g, '/').toLowerCase();
      nodeByFile.set(key, mesh);
    }
    // Also index by label
    if (node.label) nodeByFile.set(node.label.toLowerCase(), mesh);

    // Labels (god nodes always; others only if sparse graph)
    if (isGod || N <= 100) {
      const div = document.createElement('div');
      div.className = `node-label ${isGod ? 'god' : 'normal'}`;
      div.textContent = node.label ?? node.id;
      div.style.cssText = `color:${hex};font-size:${isGod?'12px':'9px'};font-weight:${isGod?700:400};
        text-shadow:0 0 8px ${hex},0 0 2px rgba(0,0,0,1);white-space:nowrap;pointer-events:none;
        ${isGod?'':'opacity:0.85'}`;
      const lbl = new CSS2DObject(div);
      lbl.position.set(0, isGod ? 0.52 : 0.24, 0);
      mesh.add(lbl);
    }
  });

  // ─── EDGES WITH VERTEX COLORS ─────────────────────────────────────────────
  const validLinks = (graph.links ?? []).filter(e =>
    nodeMap.has(String(e.source)) && nodeMap.has(String(e.target))
  );
  const ePos = [], eCol = [], eEdgeIdx = [], eEdgeT = [], edgeHexColors = [];
  // Adjacency list for synapse pulses: nodeId → [{ edgeIndex, forward }, ...]
  // forward=true means this node is the edge's source (canonical t:0→1 travels away from it)
  const adjacency = new Map();
  validLinks.forEach((e, i) => {
    const ma = nodeMap.get(String(e.source));
    const mb = nodeMap.get(String(e.target));
    const ca = new THREE.Color(ma.userData.communityColor);
    const cb = new THREE.Color(mb.userData.communityColor);
    ePos.push(ma.position.x, ma.position.y, ma.position.z,
              mb.position.x, mb.position.y, mb.position.z);
    eCol.push(ca.r, ca.g, ca.b, cb.r, cb.g, cb.b);
    eEdgeIdx.push(i, i);
    eEdgeT.push(0, 1);
    edgeHexColors.push(ma.userData.communityColor);
    const sid = String(e.source), tid = String(e.target);
    if (!adjacency.has(sid)) adjacency.set(sid, []);
    if (!adjacency.has(tid)) adjacency.set(tid, []);
    adjacency.get(sid).push({ edgeIndex: i, forward: true });
    adjacency.get(tid).push({ edgeIndex: i, forward: false });
  });
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position',   new THREE.Float32BufferAttribute(ePos, 3));
  edgeGeo.setAttribute('color',      new THREE.Float32BufferAttribute(eCol, 3));
  edgeGeo.setAttribute('aEdgeIndex', new THREE.Float32BufferAttribute(eEdgeIdx, 1));
  edgeGeo.setAttribute('aEdgeT',     new THREE.Float32BufferAttribute(eEdgeT, 1));

  // ─── SYNAPSE PULSE SHADER (traveling glow along a connection) ────────────
  // Fixed-size uniform arrays, mutated in place every frame — no per-frame allocation.
  const MAX_PULSES = 16;
  const pulseColors      = Array.from({ length: MAX_PULSES }, () => new THREE.Color());
  const pulseEdgeArr     = new Float32Array(MAX_PULSES).fill(-1);
  const pulseProgressArr = new Float32Array(MAX_PULSES);
  const activePulses     = []; // { edgeIndex, forward, startTime, duration, color }

  const edgeMat = new THREE.ShaderMaterial({
    uniforms: {
      uBaseOpacity:   { value: 0.16 },
      uPulseWidth:    { value: 0.15 },
      uPulseCount:    { value: 0 },
      uPulseEdge:     { value: pulseEdgeArr },
      uPulseProgress: { value: pulseProgressArr },
      uPulseColor:    { value: pulseColors },
    },
    vertexShader: `
      attribute vec3 color;
      attribute float aEdgeIndex;
      attribute float aEdgeT;
      varying vec3 vColor;
      varying float vEdgeT;
      varying float vEdgeIndex;
      void main() {
        vColor = color;
        vEdgeT = aEdgeT;
        vEdgeIndex = aEdgeIndex;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      #define MAX_PULSES ${MAX_PULSES}
      uniform float uBaseOpacity;
      uniform float uPulseWidth;
      uniform int   uPulseCount;
      uniform float uPulseEdge[MAX_PULSES];
      uniform float uPulseProgress[MAX_PULSES];
      uniform vec3  uPulseColor[MAX_PULSES];
      varying vec3 vColor;
      varying float vEdgeT;
      varying float vEdgeIndex;
      void main() {
        vec3 glow = vec3(0.0);
        float strength = 0.0;
        for (int i = 0; i < MAX_PULSES; i++) {
          if (i >= uPulseCount) break;
          if (abs(uPulseEdge[i] - vEdgeIndex) < 0.5) {
            float d = abs(vEdgeT - uPulseProgress[i]);
            float p = smoothstep(uPulseWidth, 0.0, d);
            glow += uPulseColor[i] * p;
            strength = max(strength, p);
          }
        }
        vec3 finalColor = vColor + glow * 2.2;
        float alpha = clamp(uBaseOpacity + strength * 0.85, 0.0, 1.0);
        gl_FragColor = vec4(finalColor, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
  });
  scene.add(new THREE.LineSegments(edgeGeo, edgeMat));

  // ─── PULSE HEAD SPRITES (glowing dot riding the beam, like fiber-optic tips) ──
  // Fixed-size buffer of MAX_PULSES points, positions/colors/alpha mutated in place each frame.
  const pulsePointPos   = new Float32Array(MAX_PULSES * 3);
  const pulsePointCol   = new Float32Array(MAX_PULSES * 3);
  const pulsePointAlpha = new Float32Array(MAX_PULSES);
  const pulsePointGeo = new THREE.BufferGeometry();
  pulsePointGeo.setAttribute('position', new THREE.BufferAttribute(pulsePointPos, 3));
  pulsePointGeo.setAttribute('color',    new THREE.BufferAttribute(pulsePointCol, 3));
  pulsePointGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(pulsePointAlpha, 1));

  const pulsePointMat = new THREE.ShaderMaterial({
    uniforms: {
      uPixelRatio: { value: renderer.getPixelRatio() },
      uSize:       { value: 1.5 },
    },
    vertexShader: `
      attribute vec3 color;
      attribute float aAlpha;
      uniform float uPixelRatio;
      uniform float uSize;
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        vColor = color;
        vAlpha = aAlpha;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = uSize * uPixelRatio * (300.0 / -mvPosition.z);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        if (vAlpha <= 0.001) discard;
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        float core = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor * (1.0 + core), core * core * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(pulsePointGeo, pulsePointMat));

  function triggerEdgePulse(edgeIndex, forward, hexColor, duration = 650) {
    if (activePulses.length >= MAX_PULSES) activePulses.shift();
    activePulses.push({ edgeIndex, forward, startTime: Date.now(), duration, color: new THREE.Color(hexColor) });
  }

  // Ambient idle pulses — keeps the sphere feeling alive even with no agent activity.
  let nextAmbientPulseAt = Date.now() + 400;
  function maybeFireAmbientPulse(now) {
    if (now < nextAmbientPulseAt || !validLinks.length) return;
    const idx = Math.floor(Math.random() * validLinks.length);
    triggerEdgePulse(idx, Math.random() < 0.5, edgeHexColors[idx], 1100);
    nextAmbientPulseAt = now + 350 + Math.random() * 700;
  }

  // ─── TRON BALL (neuron signal) ────────────────────────────────────────────
  const tronBalls = [];
  const tronBallGeo  = new THREE.SphereGeometry(0.22, 10, 8);
  const tronTrailGeo = new THREE.SphereGeometry(0.08, 6, 4);

  function emitTronBall(fromPos, toPos, hexColor, duration, onArrival) {
    const color = new THREE.Color(hexColor);
    const mat   = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const ball  = new THREE.Mesh(tronBallGeo, mat);
    ball.position.copy(fromPos);
    scene.add(ball);
    tronBalls.push({
      mesh: ball, mat, color, hexColor,
      from: fromPos.clone(), to: toPos.clone(),
      startTime: Date.now(), duration,
      trail: [], lastTrail: 0,
      onArrival,
    });
    playTronSound(hexColor, duration);
  }

  // Textura radial (círculo suave) usada nos sistemas de pontos, pra fugir do
  // quadrado padrão do PointsMaterial sem textura.
  const dotTexture = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.6)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  // Shell + stars
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(SPHERE_R + 0.6, 32, 32),
    new THREE.MeshBasicMaterial({ wireframe: true, color: 0x1a1a3a, transparent: true, opacity: 0.12 })
  ));
  // Keep stars ≥50 units from origin — a Point too close renders as a big white square
  const sp = [];
  while (sp.length < 3000 * 3) {
    const x = (Math.random()-.5)*300, y = (Math.random()-.5)*300, z = (Math.random()-.5)*300;
    if (x*x + y*y + z*z >= 50*50) sp.push(x, y, z);
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({
    color:0xffffff, size:.12, map: dotTexture, transparent:true, opacity:.4, depthWrite: false,
  })));

  // ─── NEON DUST + LATITUDE RINGS (estética mira-3d) ────────────────────────
  const neonPalette = [0x112244, 0x2B4EFF, 0x00AACC, 0x005588, 0x555555].map(h => new THREE.Color(h));
  const dustCount = 6000;
  const dustGeo = new THREE.BufferGeometry();
  const dustPos = new Float32Array(dustCount * 3);
  const dustCol = new Float32Array(dustCount * 3);
  for (let i = 0; i < dustCount; i++) {
    const u = Math.random(), v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);
    const r = SPHERE_R * (0.94 + Math.random() * 0.05); // poeira grudada na casca da esfera, sem invadir o raio da malha (SPHERE_R + 0.6)
    dustPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    dustPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    dustPos[i*3+2] = r * Math.cos(phi);
    const c = neonPalette[Math.floor(Math.random() * neonPalette.length)];
    dustCol[i*3] = c.r; dustCol[i*3+1] = c.g; dustCol[i*3+2] = c.b;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
  const dustSystem = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    size: SPHERE_R * 0.012, vertexColors: true, map: dotTexture, transparent: true, opacity: 0.5,
    sizeAttenuation: true, depthWrite: false,
  }));
  scene.add(dustSystem);

  // ─── ROBOT MASCOT (orbiting sprite) ───────────────────────────────────────
  const robotTex = new THREE.TextureLoader().load('/imagens/robo-orbitante.png');
  robotTex.colorSpace = THREE.SRGBColorSpace;
  const robotSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: robotTex, transparent: true, toneMapped: false,
  }));
  robotSprite.scale.set(2.75, 1.5, 1); // source PNG aspect 512x279
  scene.add(robotSprite);
  const ROBOT_ORBIT_R = SPHERE_R + 5;
  const ROBOT_TILT = 0.45; // orbit plane inclination (rad)

  // HUD
  hudEl.textContent = `${N} nós · ${validLinks.length} links · ${new Set(graph.nodes.map(n=>n.community)).size} comunidades · ${godIds.size} god nodes`;

  // ─── EASING ───────────────────────────────────────────────────────────────
  function easeInOutCubic(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  }

  // ─── CAMERA FLY-TO ────────────────────────────────────────────────────────
  // Snapshot of where the camera started (before any fly)
  const originPos    = camera.position.clone();
  const originTarget = new THREE.Vector3(0, 0, 0);

  const cam = {
    state: 'idle',   // 'idle' | 'flying-to' | 'at-node' | 'flying-back'
    startTime: 0, duration: 0,
    fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
    fromTgt: new THREE.Vector3(), toTgt: new THREE.Vector3(),
    returnTimer: null,
  };

  let tourActive = false;

  function flyToMesh(mesh) {
    clearTimeout(cam.returnTimer);
    const np  = mesh.position.clone();
    const dir = np.clone().normalize();
    const toPos = np.clone().add(dir.multiplyScalar(2.5));

    cam.fromPos.copy(camera.position);
    cam.fromTgt.copy(controls.target);
    cam.toPos.copy(toPos);
    cam.toTgt.copy(np);
    cam.state = 'flying-to';
    cam.startTime = Date.now();
    cam.duration = 1600;
    controls.enabled = false;
    controls.autoRotate = false;

    // Auto-return only outside of tour
    if (!tourActive) cam.returnTimer = setTimeout(flyBack, 4000 + 1600);
  }

  function flyBack() {
    cam.fromPos.copy(camera.position);
    cam.fromTgt.copy(controls.target);
    cam.toPos.copy(originPos);
    cam.toTgt.copy(originTarget);
    cam.state = 'flying-back';
    cam.startTime = Date.now();
    cam.duration = 1800;
  }

  // ─── RIPPLE RINGS ─────────────────────────────────────────────────────────
  const ripples = [];
  const ringGeo = new THREE.TorusGeometry(1, 0.04, 6, 40);

  function addRipple(pos, hexColor) {
    const col = new THREE.Color(hexColor);
    const rings = [
      new THREE.Euler(0, 0, 0),
      new THREE.Euler(Math.PI / 2, 0, 0),
      new THREE.Euler(0, Math.PI / 2, 0),
    ].map(rot => {
      const mat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 1 });
      const mesh = new THREE.Mesh(ringGeo, mat);
      mesh.position.copy(pos);
      mesh.rotation.copy(rot);
      scene.add(mesh);
      return { mesh, mat };
    });
    ripples.push({ rings, startTime: Date.now() });
  }

  // ─── ACTIVE NODE ANIMATION ────────────────────────────────────────────────
  const activeNodes  = new Map();
  const visitedNodes = new Map(); // id → { color, count }

  function activateNode(mesh, hexColor, durationMs = 3500) {
    const id = mesh.userData.id;
    const existing = activeNodes.get(id);
    if (existing) clearTimeout(existing.timeout);

    // Track visits for persistent glow
    const prev = visitedNodes.get(id) ?? { count: 0 };
    visitedNodes.set(id, { color: hexColor, count: prev.count + 1 });

    const timeout = setTimeout(() => {
      activeNodes.delete(id);
      // After pulse: keep a dim visited glow scaled by visit count
      const visits = visitedNodes.get(id)?.count ?? 0;
      const glowIntensity = mesh.userData.baseIntensity + Math.min(visits * 0.6, 3.0);
      mesh.material.emissiveIntensity = glowIntensity;
      // Blend toward white with each revisit
      const communityCol = new THREE.Color(mesh.userData.communityColor);
      const white = new THREE.Color('#ffffff');
      mesh.material.emissive.copy(communityCol).lerp(white, Math.min(visits * 0.12, 0.5));
      mesh.scale.setScalar(1);
    }, durationMs);
    activeNodes.set(id, {
      mesh, startTime: Date.now(),
      pulseColor: new THREE.Color(hexColor), durationMs, timeout,
    });
    addRipple(mesh.position, hexColor);
    playNodeSound(hexColor);
    flyToMesh(mesh);

    // Synapse pulse: signal arrives at this node from a random neighbor
    const neighbors = adjacency.get(id);
    if (neighbors && neighbors.length) {
      const link = neighbors[Math.floor(Math.random() * neighbors.length)];
      triggerEdgePulse(link.edgeIndex, !link.forward, hexColor, 650);
    }
  }

  // ─── FILE → NODE LOOKUP ───────────────────────────────────────────────────
  function findMeshByPath(filePath) {
    if (!filePath) return null;
    const norm = filePath.replace(/\\/g, '/').toLowerCase();
    for (const [key, mesh] of nodeByFile) {
      if (norm.endsWith(key) || norm.endsWith('/' + key)) return mesh;
    }
    return nodeByFile.get(norm.split('/').pop()) ?? null;
  }

  const allMeshes = () => [...nodeMap.values()];
  function randomMesh() {
    const arr = allMeshes();
    return arr[Math.floor(Math.random() * arr.length)] ?? null;
  }

  // TEST button — single random fly
  document.getElementById('test-btn').addEventListener('click', () => {
    const m = randomMesh();
    if (m) activateNode(m, '#00ffcc');
  });

  // TOUR — TRON sequencial: câmera chega → nó pulsa → bolinha viaja → câmera segue
  const tourBtn = document.getElementById('tour-btn');
  let tourTimeout = null;
  const TOUR_STEPS = [
    { tool: 'Read',  color: '#00ffee', icon: '📖' },
    { tool: 'Edit',  color: '#ffcc00', icon: '✏️'  },
    { tool: 'Grep',  color: '#cc00ff', icon: '🔍' },
    { tool: 'Write', color: '#00ff44', icon: '📝' },
    { tool: 'Bash',  color: '#00ccff', icon: '⚡' },
    { tool: 'Read',  color: '#00ffee', icon: '📖' },
    { tool: 'Edit',  color: '#ffcc00', icon: '✏️'  },
    { tool: 'Bash',  color: '#00ccff', icon: '⚡' },
  ];

  function buildTourNodes() {
    const byCommunity = new Map();
    for (const mesh of nodeMap.values()) {
      const c = mesh.userData.communityColor;
      if (!byCommunity.has(c)) byCommunity.set(c, []);
      byCommunity.get(c).push(mesh);
    }
    const selected = [];
    for (const [, meshes] of byCommunity) {
      selected.push(meshes[Math.floor(Math.random() * meshes.length)]);
      if (selected.length >= TOUR_STEPS.length) break;
    }
    while (selected.length < TOUR_STEPS.length) selected.push(randomMesh());
    return selected;
  }

  function addTourLog(s, mesh, step, total) {
    const entry = document.createElement('div');
    entry.className = 'log-entry pre';
    if (chatEmpty) chatEmpty.remove();
    const pill = document.createElement('div');
    pill.className = 'chat-msg tool-evt';
    pill.style.color = s.color;
    pill.textContent = `${s.icon} ${s.tool} → ${mesh.userData.id} [${step}/${total}]`;
    chatMessages.appendChild(pill);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    eventCount++;
  }

  function stopTour() {
    clearTimeout(tourTimeout);
    tourTimeout = null;
    tourActive = false;
    tourBtn.textContent = '⟳ TOUR';
    tourBtn.classList.remove('running');
    flyBack();
  }

  function runTour(nodes, step) {
    if (!tourActive || step >= nodes.length) { stopTour(); return; }

    const s     = TOUR_STEPS[step % TOUR_STEPS.length];
    const curr  = nodes[step];
    const next  = nodes[step + 1];

    // 1. Fly camera to current node + pulse it
    activateNode(curr, s.color, 2500);
    actionEl.textContent = `${s.icon} ${s.tool} → ${curr.userData.id}`;
    addTourLog(s, curr, step + 1, nodes.length);

    const ARRIVE   = 1600;  // camera flight time
    const STAY     = 900;   // brief stay after arrival before ball departs
    const BALL_DUR = 1100;  // TRON ball travel time
    const CAM_LAG  = 400;   // camera departs this long AFTER ball

    if (next) {
      // 2. After arriving + staying, fire TRON ball toward next node
      tourTimeout = setTimeout(() => {
        if (!tourActive) return;
        const nextStep = TOUR_STEPS[(step + 1) % TOUR_STEPS.length];
        emitTronBall(curr.position, next.position, nextStep.color, BALL_DUR, null);

        // 3. Camera departs toward next node slightly after ball
        tourTimeout = setTimeout(() => {
          if (!tourActive) return;
          runTour(nodes, step + 1);
        }, CAM_LAG);

      }, ARRIVE + STAY);
    } else {
      // Last node — stay then end
      tourTimeout = setTimeout(stopTour, ARRIVE + 3000);
    }
  }

  tourBtn.addEventListener('click', () => {
    if (tourActive) { stopTour(); return; }
    tourActive = true;
    tourBtn.textContent = '■ PARAR';
    tourBtn.classList.add('running');
    runTour(buildTourNodes(), 0);
  });

  // ─── AUDIO ────────────────────────────────────────────────────────────────
  let audioCtx = null;
  let muted = false;

  function getAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, dur, gain = 0.12, type = 'sine', detune = 0) {
    if (muted) return;
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.connect(env); env.connect(ctx.destination);
      osc.type = type;
      osc.frequency.value = freq;
      osc.detune.value = detune;
      env.gain.setValueAtTime(gain, ctx.currentTime);
      env.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + dur);
    } catch {}
  }

  function playSweep(freqFrom, freqTo, dur, gain = 0.07) {
    if (muted) return;
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.connect(env); env.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqFrom, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(freqTo, ctx.currentTime + dur);
      env.gain.setValueAtTime(gain, ctx.currentTime);
      env.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + dur);
    } catch {}
  }

  // Map hex color to a musical note (pentatonic scale — always sounds good)
  const PENTATONIC = [220, 261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3, 784];
  function colorToFreq(hex) {
    const n = parseInt(hex.replace('#','').slice(0,4), 16) % PENTATONIC.length;
    return PENTATONIC[n];
  }

  function playNodeSound(hexColor) {
    const freq = colorToFreq(hexColor);
    playTone(freq, 0.4, 0.10);
    playTone(freq * 2, 0.2, 0.04);          // octave overtone
    playTone(freq * 1.5, 0.15, 0.03, 'sine', 5); // fifth, slightly detuned
  }

  function playTronSound(hexColor, dur) {
    const freq = colorToFreq(hexColor);
    playSweep(freq * 0.5, freq * 1.5, dur / 1000, 0.06); // pitch rises as ball travels
  }

  const menuToggle = document.getElementById('menu-toggle');
  const menuItems  = document.getElementById('menu-items');
  menuToggle.addEventListener('click', e => {
    e.stopPropagation();
    menuItems.style.display = menuItems.style.display === 'none' ? 'flex' : 'none';
  });
  document.addEventListener('click', () => { menuItems.style.display = 'none'; });

  document.getElementById('restart-btn').addEventListener('click', () => {
    fetch('/restart', { method: 'POST' }).catch(() => {});
  });

  document.getElementById('mute-btn').addEventListener('click', () => {
    muted = !muted;
    const btn = document.getElementById('mute-btn');
    btn.textContent = muted ? '🔇 Som' : '🔊 Som';
    btn.style.opacity = muted ? '0.4' : '1';
  });

  // ─── FULLSCREEN (tecla F) ─────────────────────────────────────────────────
  const logPanel = document.getElementById('chat-panel');
  let isFullscreen = false;
  document.addEventListener('keydown', e => {
    if (e.key !== 'f' && e.key !== 'F') return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    isFullscreen = !isFullscreen;
    logPanel.style.display = isFullscreen ? 'none' : '';
    // Force immediate resize
    const w = wrap.clientWidth, h = wrap.clientHeight;
    camera.aspect = w / h;
    if (cam.state === 'idle') {
      const dist = fitDistance(w, h);
      camera.position.setLength(dist);
      originPos.setLength(dist);
    }
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    labelRenderer.setSize(w, h);
    hudEl.innerHTML = `${N} nós · ${validLinks.length} links · ${new Set(graph.nodes.map(n=>n.community)).size} comunidades · ${godIds.size} god nodes`
      + (isFullscreen ? ' &nbsp;<span style="opacity:0.4">[F] sair fullscreen</span>' : ' &nbsp;<span style="opacity:0.4">[F] fullscreen</span>');
  });
  hudEl.innerHTML += ' &nbsp;<span style="opacity:0.3">[F] fullscreen</span>';

  // ─── WEBSOCKET ────────────────────────────────────────────────────────────
  let ws = null;
  let currentClaudeMsg = null;
  let projectName = null;

  function connectWS() {
    setWS('connecting');
    const urlParams = new URLSearchParams(window.location.search);
    const projectParam = urlParams.get('project');
    const wsUrl = projectParam
      ? `ws://localhost:3747?project=${encodeURIComponent(projectParam)}`
      : 'ws://localhost:3747';
    ws = new WebSocket(wsUrl);
    ws.onopen  = () => {
      setWS('connected');
      if (projectParam) {
        ws.send(JSON.stringify({ type: 'subscribe', project: projectParam }));
      }
    };
    ws.onclose = () => { setWS('disconnected'); ws = null; setTimeout(connectWS, 3000); };
    ws.onerror = () => {};
    ws.onmessage = ({ data }) => {
      try {
        const event = JSON.parse(data);
        if (event.type === 'chat_token') { appendChatToken(event.content); return; }
        if (event.type === 'chat_done')  { finishChatMessage(); return; }
        handleEvent(event);
      } catch {}
    };
  }

  function handleEvent(event) {
    if (!event?.tool || event.type !== 'PreToolUse') return;
    eventCount++;
    const meta  = toolMeta(event.tool);
    const input = event.input ?? {};
    const fpath = input.file_path ?? input.path ?? '';
    const short = fpath
      ? fpath.replace(/\\/g,'/').split('/').pop()
      : (input.command?.slice(0,40) ?? input.pattern ?? '');

    actionEl.textContent = `${meta.icon} ${event.tool}${short ? ' → ' + short : ''}`;

    const mesh = findMeshByPath(fpath)
      ?? (input.symbol_name ? nodeByFile.get(input.symbol_name.toLowerCase()) : null)
      ?? randomMesh();
    if (mesh) activateNode(mesh, meta.color);

    // Tool event inline no chat
    if (chatEmpty) chatEmpty.remove();
    const pill = document.createElement('div');
    pill.className = 'chat-msg tool-evt';
    pill.style.color = meta.color;
    pill.textContent = `${meta.icon} ${meta.label}${short ? ' → ' + short : ''}`;
    chatMessages.appendChild(pill);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    while (chatMessages.children.length > 120) chatMessages.removeChild(chatMessages.firstChild);
  }

  // ─── CHAT ────────────────────────────────────────────────────────────────
  function addChatMsg(role, text = '', streaming = false) {
    if (chatEmpty) chatEmpty.remove();
    const div = document.createElement('div');
    div.className = `chat-msg ${role}${streaming ? ' streaming' : ''}`;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  function appendChatToken(token) {
    if (!currentClaudeMsg) currentClaudeMsg = addChatMsg('claude', '', true);
    currentClaudeMsg.textContent += token;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function finishChatMessage() {
    if (currentClaudeMsg) { currentClaudeMsg.classList.remove('streaming'); currentClaudeMsg = null; }
    chatSend.disabled = false;
    chatStatus.textContent = '';
  }

  function doSend() {
    const prompt = chatInput.value.trim();
    if (!prompt || !ws || ws.readyState !== 1) return;
    addChatMsg('user', prompt);
    chatInput.value = '';
    chatSend.disabled = true;
    chatStatus.textContent = 'Pensando…';
    currentClaudeMsg = null;
    ws.send(JSON.stringify({ type: 'chat', prompt, model: modelSelect.value }));
  }

  chatSend.addEventListener('click', doSend);
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  });

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── RENDER LOOP ──────────────────────────────────────────────────────────
  let rafId = null;
  function animate() {
    rafId = requestAnimationFrame(animate);
    const now = Date.now();

    // Neon dust drift — rotação sutil e independente da poeira grudada na esfera
    dustSystem.rotation.y += 0.0006;
    dustSystem.rotation.x += 0.0002;

    // Robot mascot orbit — ~60s per revolution on a tilted plane, with a soft bob
    const ra = now * (Math.PI * 2 / 60000);
    robotSprite.position.set(
      Math.cos(ra) * ROBOT_ORBIT_R,
      Math.sin(ra) * ROBOT_ORBIT_R * Math.sin(ROBOT_TILT) + Math.sin(now * 0.0012) * 0.5,
      Math.sin(ra) * ROBOT_ORBIT_R * Math.cos(ROBOT_TILT)
    );

    // Camera fly animation — bypasses OrbitControls entirely during flight
    if (cam.state === 'flying-to' || cam.state === 'flying-back') {
      const t = Math.min(1, (now - cam.startTime) / cam.duration);
      const e = easeInOutCubic(t);
      camera.position.lerpVectors(cam.fromPos, cam.toPos, e);
      controls.target.lerpVectors(cam.fromTgt, cam.toTgt, e);
      camera.lookAt(controls.target);
      // FOV bulge: widens at midpoint (t=0.5) for cinematic depth
      const fovBulge = Math.sin(t * Math.PI); // 0→1→0
      camera.fov = 60 + fovBulge * 22;
      camera.updateProjectionMatrix();
      if (t >= 1) {
        camera.fov = 60;
        camera.updateProjectionMatrix();
        if (cam.state === 'flying-back') {
          cam.state = 'idle';
          controls.target.copy(originTarget);
          camera.position.copy(originPos);
          controls.enabled = true;
          controls.autoRotate = true;
          controls.update();
        } else {
          cam.state = 'at-node';
        }
      }
    } else {
      controls.update();
    }

    // Pulse active nodes (emissive + scale)
    activeNodes.forEach(state => {
      const t = Math.min(1, (now - state.startTime) / state.durationMs);
      const pulse = Math.sin(t * Math.PI * 8) * (1 - t);
      state.mesh.material.emissiveIntensity = state.mesh.userData.baseIntensity + pulse * 8;
      state.mesh.material.emissive.lerp(state.pulseColor, 0.5 + pulse * 0.5);
      state.mesh.scale.setScalar(1 + Math.max(0, pulse) * 1.5);
    });

    // Animate TRON balls (neuron signals)
    for (let i = tronBalls.length - 1; i >= 0; i--) {
      const b = tronBalls[i];
      const t = Math.min(1, (now - b.startTime) / b.duration);
      const e = easeInOutCubic(t);
      b.mesh.position.lerpVectors(b.from, b.to, e);

      // Emit trail particle every 14ms — denser trail
      if (now - b.lastTrail > 14) {
        const tmat = new THREE.MeshBasicMaterial({
          color: b.color, transparent: true, opacity: 0.95,
        });
        const tmesh = new THREE.Mesh(tronTrailGeo, tmat);
        tmesh.position.copy(b.mesh.position);
        tmesh.scale.setScalar(1.0 + Math.random() * 0.4);
        scene.add(tmesh);
        b.trail.push({ mesh: tmesh, mat: tmat, born: now });
        b.lastTrail = now;
      }

      // Age and shrink trail — 900ms lifetime for long comet tail
      for (let j = b.trail.length - 1; j >= 0; j--) {
        const tp = b.trail[j];
        const age = (now - tp.born) / 900;
        if (age >= 1) {
          scene.remove(tp.mesh); tp.mat.dispose(); b.trail.splice(j, 1);
        } else {
          tp.mat.opacity = Math.pow(1 - age, 1.5) * 0.9;
          tp.mesh.scale.setScalar((1 - age * 0.8) * (0.9 + Math.random() * 0.2));
        }
      }

      if (t >= 1) {
        scene.remove(b.mesh); b.mat.dispose();
        b.trail.forEach(tp => { scene.remove(tp.mesh); tp.mat.dispose(); });
        tronBalls.splice(i, 1);
        if (b.onArrival) b.onArrival();
      }
    }

    // Update synapse pulses traveling along edges (mutates fixed uniform arrays, no allocation)
    maybeFireAmbientPulse(now);
    for (let i = activePulses.length - 1; i >= 0; i--) {
      if (now - activePulses[i].startTime >= activePulses[i].duration) activePulses.splice(i, 1);
    }
    const pulseN = Math.min(activePulses.length, MAX_PULSES);
    pulsePointAlpha.fill(0, pulseN); // clear stale head-dot slots left over from expired pulses
    for (let i = 0; i < pulseN; i++) {
      const p = activePulses[i];
      const raw = Math.min(1, (now - p.startTime) / p.duration);
      const eased = easeInOutCubic(raw);
      const envelope = Math.min(1, raw / 0.12) * Math.min(1, (1 - raw) / 0.2);
      const t = p.forward ? eased : 1 - eased;
      pulseEdgeArr[i] = p.edgeIndex;
      pulseProgressArr[i] = t;
      pulseColors[i].copy(p.color).multiplyScalar(envelope);

      // Traveling light-dot at the pulse head, lerped along the edge's own vertex positions
      const base = p.edgeIndex * 6;
      pulsePointPos[i*3+0] = ePos[base+0] + (ePos[base+3] - ePos[base+0]) * t;
      pulsePointPos[i*3+1] = ePos[base+1] + (ePos[base+4] - ePos[base+1]) * t;
      pulsePointPos[i*3+2] = ePos[base+2] + (ePos[base+5] - ePos[base+2]) * t;
      pulsePointCol[i*3+0] = p.color.r;
      pulsePointCol[i*3+1] = p.color.g;
      pulsePointCol[i*3+2] = p.color.b;
      pulsePointAlpha[i] = envelope;
    }
    edgeMat.uniforms.uPulseCount.value = pulseN;
    pulsePointGeo.attributes.position.needsUpdate = true;
    pulsePointGeo.attributes.color.needsUpdate = true;
    pulsePointGeo.attributes.aAlpha.needsUpdate = true;

    // Expand ripple rings
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      const t = Math.min(1, (now - r.startTime) / 2000);
      const scale = 0.4 + t * 7;
      r.rings.forEach(({ mesh, mat }) => {
        mesh.scale.setScalar(scale);
        mat.opacity = 1 - t;
      });
      if (t >= 1) {
        r.rings.forEach(({ mesh }) => scene.remove(mesh));
        ripples.splice(i, 1);
      }
    }

    composer.render();
    labelRenderer.render(scene, camera);
  }

  new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting && rafId === null) animate();
      else if (!e.isIntersecting && rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    });
  }, { threshold: 0.1 }).observe(wrap);

  new ResizeObserver(() => {
    const w = W(), h = H();
    camera.aspect = w / h;
    if (cam.state === 'idle') {
      const dist = fitDistance(w, h);
      camera.position.setLength(dist);
      originPos.setLength(dist);
    }
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    labelRenderer.setSize(w, h);
  }).observe(wrap);

  animate();
  connectWS();

  // resolve project name from URL param or server
  const urlParams = new URLSearchParams(window.location.search);
  const projectParam = urlParams.get('project');
  if (projectParam) {
    projectName = projectParam;
    document.title = `Claude Observer — ${projectName}`;
    document.getElementById('project-name').textContent = projectName;
  } else {
    fetch('/project-name').then(r => r.json()).then(({ name }) => {
      projectName = name;
      document.title = `Claude Observer — ${name}`;
      document.getElementById('project-name').textContent = name;
    }).catch(() => {});
  }
}
</script>
</body>
</html>
